<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#040506" />
    <title>Ga tau namain apa</title>
    <meta name="description" content="An interactive 1970s investigation room — a CRT television and an evidence board." />
  </head>
  <body>
    <canvas id="scene" aria-label="Interactive 3D investigation room"></canvas>

    <div id="loader" role="dialog" aria-live="polite">
      <div class="loader-inner">
        <p class="file">Ruangan</p>
        <p class="status" id="load-status">loading bentar</p>
        <div class="bar"><span id="load-bar"></span></div>
        <button id="enter" type="button" hidden>Pencet aja</button>
        <p class="warn" id="load-note">recommend pake laptop, kalau di hp berat</p>
      </div>
    </div>

    <div id="subtitle" aria-live="polite"><span></span></div>
    <p id="caption" aria-live="polite"></p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
